<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Vocab Venture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="world" class="gray">
  <div id="pano"></div>
  <div id="scene"><div id="sky"></div><div id="ground"></div><div id="objects"></div></div>
</div>
<div id="hud" hidden>
  <span id="score">0 pts</span>
  <button id="gear" aria-label="Pause menu">⚙</button>
</div>
<div id="touch" hidden>
  <button data-key="w">W</button><button data-key="a">A</button><button data-key="s">S</button><button data-key="d">D</button>
</div>
<div id="overlay" hidden><div id="panel"></div></div>
<script src="config.js"></script>
<script src="js/words.js"></script>
<script src="js/accounts.js"></script>
<script src="js/game.js"></script>
</body>
</html>
